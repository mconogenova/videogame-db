<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videogame DB</title>
<!-- Nome dell'app quando viene aggiunta alla Home -->
<meta name="apple-mobile-web-app-title" content="Videogame DB">
<meta name="application-name" content="Videogame DB">

<!-- Icona per dispositivi Android/Chrome e Apple -->
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<!-- Collegamento al Web App Manifest (necessario per Android) -->
<link rel="manifest" href="manifest.json">

<!-- Font per il logo dell'header -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

<!-- Icone (lente di ricerca, freccia, stelle, fiammelle…) usate dalla barra filtri -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
<style>
  :root{
    --paper: #EAE2CA;
    --paper-dim: #DED2AC;
    --paper-hi: #F5EFDC;
    --ink: #2B2420;
    --ink-soft: #5B5245;
    --wood: #4E3C29;
    --wood-dark: #362A1C;
    --stamp: #9C3B2E;
    --stamp-dim: #C97C6C;
    --brass: #93732E;
    --brass-dim: #C9AE72;
    --sage: #52654A;
    --sage-dim: #92A487;
    --slate: #3E5266;
    --slate-dim: #86A0B4;
    --plum: #7A4C6B;
    --line: rgba(43,36,32,0.18);
    --border: rgba(43,36,32,0.18);
    --border-strong: rgba(43,36,32,0.4);
    --shadow-flat: 4px 4px 0 rgba(43,36,32,0.18);
    --shadow-flat-sm: 3px 3px 0 rgba(43,36,32,0.16);
    --radius: 3px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Courier New", Courier, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--brass-dim); color: var(--ink); }

  a{ color: inherit; }

  /* ---------- App shell ---------- */
  #app{ display:flex; flex-direction:column; min-height:100vh; }
  #app.hidden{ display:none; }
  .field input[type="email"], .field input[type="password"]{
    width:100%; background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 9px 10px; font-family: var(--sans); font-size: 14px; color: var(--ink);
  }

  header.top{
    background: var(--wood);
    color: var(--paper-hi);
    padding: 22px 28px 18px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--brass);
  }
  .brand{ display: inline-block; line-height: 1; }
  .brand .logo-main{
    font-family: 'Barriecito', cursive;
    font-size: 36px;
    color: var(--paper-hi);
    letter-spacing: 0.5px;
  }
  .brand .logo-sub{
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--paper-hi);
    text-align: right;
    margin-top: 3px;
  }
  header.top .primary, header.top .secondary{
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  header.top .secondary{
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    box-shadow: var(--shadow-flat-sm);
    border-radius: 8px;
  }
  header.top .secondary:hover{
    background: var(--paper-hi);
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
  }
  header.top .secondary:active{ transform: translate(0,0); box-shadow: 1px 1px 0 rgba(0,0,0,0.25); }
  header.top .primary{
    background: var(--paper);
    border: 1px solid var(--stamp);
    color: var(--stamp);
    box-shadow: var(--shadow-flat-sm);
    border-radius: 8px;
  }
  header.top .primary:hover{
    background: var(--paper-hi);
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
  }
  header.top .primary:active{ transform: translate(0,0); box-shadow: 1px 1px 0 rgba(0,0,0,0.25); }
  button.primary{
    background: var(--stamp);
    color: var(--paper-hi);
    border: 1px solid rgba(0,0,0,0.25);
    padding: 11px 18px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: var(--shadow-flat-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    white-space: nowrap;
  }
  button.primary:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.25); }
  button.primary:active{ transform: translate(0,0); box-shadow: 1px 1px 0 rgba(0,0,0,0.25); }

  /* ---------- Stats ledger ---------- */
  .stats{
    display:flex;
    gap: 0;
    background: var(--wood-dark);
    color: var(--paper-hi);
    overflow-x: auto;
  }
  .stat{
    padding: 10px 22px;
    border-right: 1px solid rgba(245,239,220,0.14);
    min-width: 140px;
  }
  .stat .n{ font-family: var(--mono); font-size: 19px; font-weight: 700; display:block; }
  .stat .l{ font-size: 11.5px; color: var(--brass-dim); margin-top:2px; }

  /* ---------- Barra filtri "per scheda" ---------- */
  .filterbar{ background: var(--wood); }
  .filterbar .tabrow{
    display:flex; gap:4px; background: var(--wood);
    padding: 14px 24px 0; overflow-x:auto;
  }
  .filterbar .tabbtn{
    background: var(--wood-dark); color: var(--brass-dim); border:none;
    font-family: var(--sans); font-size:14px; font-weight:600;
    padding: 10px 16px 12px; border-radius: var(--radius) var(--radius) 0 0;
    cursor:pointer; white-space:nowrap; position:relative; top:2px;
  }
  .filterbar .tabbtn .count{ font-family: var(--mono); font-size:11.5px; opacity:.75; margin-left:6px; }
  .filterbar .tabbtn.on{ background: var(--paper); color: var(--ink); top:0; }
  .filterbar .tabbtn.on .count{ opacity:.55; }

  .filterbar .bar{ background: var(--paper); padding:14px 24px; border-bottom: 1px solid var(--line); }
  .filterbar .row1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filterbar .searchwrap{ flex:1 1 200px; position:relative; }
  .filterbar .searchwrap i{ position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--ink-soft); pointer-events:none; }
  .filterbar .searchwrap input{
    width:100%; padding:9px 34px 9px 11px; border:1px solid var(--border-strong); border-radius:var(--radius);
    background: var(--paper-hi); color: var(--ink); font-family: var(--sans); font-size:14px; box-sizing:border-box;
  }
  .filterbar select.sortsel{
    border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--paper-hi);
    color:var(--ink); font-family:var(--sans); font-size:13.5px; padding:9px 8px;
  }
  .filterbar .filtbtn{
    display:flex; align-items:center; gap:6px; background:var(--paper-hi); border:1px solid var(--border-strong);
    border-radius:var(--radius); padding:9px 13px; color:var(--ink); font-family:var(--sans); font-size:13.5px;
    font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .filterbar .filtbtn i.chev{ transition: transform .15s; }
  .filterbar .filtbtn.open i.chev{ transform: rotate(180deg); }
  .filterbar .filter-badge{
    background: var(--stamp); color: var(--paper-hi); border-radius:10px; font-size:10.5px;
    padding:1px 6px; font-weight:600;
  }
  .filterbar .chips{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; }
  .filterbar .chip{
    display:flex; align-items:center; gap:5px; background:var(--brass-dim); color:var(--wood-dark);
    font-size:12px; font-weight:600; padding:5px 7px 5px 10px; border-radius:12px;
  }
  .filterbar .chip i{ cursor:pointer; font-size:14px; }
  .filterbar .clear-filters{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    font-family: var(--sans); font-size:12.5px; cursor:pointer; padding:4px;
  }
  .filterbar .panel{ display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-strong); flex-direction:column; gap:14px; }
  .filterbar .panel.open{ display:flex; }
  .filterbar .group label{
    display:block; font-size:11px; color:var(--ink-soft); font-weight:600;
    margin-bottom:7px; text-transform:uppercase; letter-spacing:.04em;
  }
  .filterbar .optrow{ display:flex; flex-wrap:wrap; gap:7px; }
  .filterbar .opt{
    background:var(--paper-hi); border:1px solid var(--border-strong); border-radius:5px;
    padding:7px 11px; font-family: var(--sans); font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .filterbar .opt.on{ background:var(--stamp); border-color:var(--stamp); color:var(--paper-hi); }
  .filterbar .opt.iconopt{ padding:7px 12px; display:flex; align-items:center; }
  .filterbar .opt.iconopt i{ font-size:16px; color:inherit; }
  .filterbar select.groupsel, .filterbar input.yearinput{
    border:1px solid var(--border-strong); border-radius:5px; background:var(--paper-hi);
    color:var(--ink); font-family: var(--sans); font-size:14px; padding:7px 9px;
  }
  .filterbar input.yearinput{ width:110px; }

  /* ---------- Main + grid ---------- */
  main{ flex:1; padding: 22px 24px 60px; }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 20px;
  }

  .empty-state{
    border: 1px dashed var(--ink-soft);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 20px auto;
  }
  .empty-state h3{ font-family: var(--serif); font-size: 19px; color: var(--ink); margin: 0 0 8px; }
  .empty-state p{ font-size: 14px; line-height: 1.5; margin: 0 0 16px; }

  .load-more-wrap{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-top: 28px; text-align:center;
  }
  .load-more-wrap.hidden{ display:none; }
  .load-more-count{ font-size:12.5px; color: var(--ink-soft); margin:0; }

  /* ---------- Card ---------- */
  .card{
    background: var(--paper-hi);
    border: 2px solid var(--ink);
    border-radius: 10px;
    box-shadow: var(--shadow-flat);
    padding: 16px 16px 14px;
    cursor: pointer;
    position: relative;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .card:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(43,36,32,0.22); }

  /* Cornice colorata in base allo stato della card (coerente coi badge) */
  .card.b-in-corso, .card.b-infinito{ border-color: var(--stamp); box-shadow: 4px 4px 0 rgba(156,59,46,0.18); }
  .card.b-in-corso:hover, .card.b-infinito:hover{ box-shadow: 6px 6px 0 rgba(156,59,46,0.3); }
  .card.b-finito{ border-color: var(--sage); box-shadow: 4px 4px 0 rgba(82,101,74,0.18); }
  .card.b-finito:hover{ box-shadow: 6px 6px 0 rgba(82,101,74,0.3); }
  .card.b-da-giocare{ border-color: var(--slate); box-shadow: 4px 4px 0 rgba(62,82,102,0.18); }
  .card.b-da-giocare:hover{ box-shadow: 6px 6px 0 rgba(62,82,102,0.3); }
  .card.b-comprare{ border-color: var(--brass); box-shadow: 4px 4px 0 rgba(147,115,46,0.18); }
  .card.b-comprare:hover{ box-shadow: 6px 6px 0 rgba(147,115,46,0.3); }
  .card.b-in-uscita{ border-color: var(--ink-soft); box-shadow: 4px 4px 0 rgba(91,82,69,0.18); }
  .card.b-in-uscita:hover{ box-shadow: 6px 6px 0 rgba(91,82,69,0.3); }
  .card.b-collezione{ border-color: var(--plum); box-shadow: 4px 4px 0 rgba(122,76,107,0.18); }
  .card.b-collezione:hover{ box-shadow: 6px 6px 0 rgba(122,76,107,0.3); }

  .flames{ display:inline-flex; gap:2px; align-items:center; }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-title{ font-family: var(--serif); font-size: 18px; font-weight:700; line-height:1.25; margin:0; }
  .badge{
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
    border: 1px solid transparent;
    flex-shrink: 0;
  }
  .badge.in-corso{ background: rgba(156,59,46,0.12); color: var(--stamp); border-color: rgba(156,59,46,0.35); }
  .badge.finito{ background: rgba(82,101,74,0.14); color: var(--sage); border-color: rgba(82,101,74,0.35); }
  .badge.da-giocare{ background: rgba(62,82,102,0.13); color: var(--slate); border-color: rgba(62,82,102,0.35); }
  .badge.infinito{ background: rgba(156,59,46,0.12); color: var(--stamp); border-color: rgba(156,59,46,0.35); }
  .badge.comprare{ background: rgba(147,115,46,0.16); color: var(--brass); border-color: rgba(147,115,46,0.4); }
  .badge.in-uscita{ background: rgba(43,36,32,0.07); color: var(--ink-soft); border-color: var(--line); }
  .badge.solo-collezione{ background: rgba(122,76,107,0.13); color: var(--plum); border-color: rgba(122,76,107,0.35); }
  .badge.prenotato{ background: rgba(82,101,74,0.14); color: var(--sage); border-color: rgba(82,101,74,0.35); }
  .badge.abbandonato{ background: rgba(156,59,46,0.12); color: var(--stamp); border-color: rgba(156,59,46,0.35); }

  .card-meta{ font-size: 13px; color: var(--ink-soft); line-height:1.6; }
  .card-meta .row{ display:flex; justify-content:space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 5px; }
  .card-meta .row:first-child{ border-top:none; padding-top:0; }
  .card-meta .row span:last-child{ text-align:right; color: var(--ink); font-weight:500; }

  .dots{ display:flex; gap:5px; flex-wrap:wrap; }
  .dot{
    display:inline-flex; align-items:center; gap:4px;
    font-size: 11.5px; color: var(--ink-soft);
    background: var(--paper-dim);
    border-radius: 9px;
    padding: 2px 8px 2px 5px;
  }
  .dot i{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  .stars{ font-size: 13px; letter-spacing: 1px; color: var(--brass); }
  .stars .off{ color: var(--line); }

  .card-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .badges-row{ display:flex; gap:6px; flex-wrap:wrap; }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(43,36,32,0.55);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 30px 16px; overflow-y:auto; z-index: 100;
  }
  .overlay.hidden{ display:none; }
  .dialog{
    background: var(--paper-hi);
    border: 1px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
    max-width: 640px;
    width: 100%;
    margin: 20px 0 40px;
    border-radius: var(--radius);
  }
  .dialog.small{ max-width: 420px; }

  #login-screen .dialog{
    border-radius: 16px;
    overflow: hidden;
  }
  #login-screen .dialog-head{
    display: block;
    text-align: center;
    padding: 26px 24px 22px;
  }
  #login-screen input[type="email"],
  #login-screen input[type="password"]{
    border-radius: 8px;
  }
  .dialog-head{
    background: var(--wood);
    color: var(--paper-hi);
    padding: 16px 22px;
    display:flex; justify-content:space-between; align-items:center;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .dialog-head h2{ font-family: var(--serif); font-size:20px; margin:0; }
  .dialog-head button{
    background:none; border:none; color: var(--brass-dim); font-size:22px; cursor:pointer; line-height:1;
  }
  .dialog-body{ padding: 20px 22px 6px; max-height: 70vh; overflow-y:auto; }
  .dialog-foot{
    padding: 16px 22px 20px;
    display:flex; justify-content:space-between; gap: 10px;
    border-top: 1px solid var(--line);
  }

  fieldset{ border: none; padding: 0; margin: 0 0 20px; }
  fieldset legend{
    font-family: var(--serif); font-size: 15px; font-weight:700;
    padding: 0 0 8px; width:100%; border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 12.5px; color: var(--ink-soft); margin-bottom:4px; font-weight:600; }
  .field input[type="text"], .field input[type="date"], .field input[type="number"],
  .field select, .field textarea{
    width:100%; background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 9px 10px; font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .field textarea{ min-height: 64px; resize: vertical; font-family: var(--sans); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
  .checkbox-row input{ width:16px; height:16px; }
  .checkbox-row label{ font-size:13.5px; color: var(--ink); font-weight:500; margin:0; }
  .hint{ font-size: 11.5px; color: var(--ink-soft); margin-top:-6px; margin-bottom:12px; }

  .owned-entry{
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 10px; background: var(--paper);
    position: relative;
  }
  .owned-entry .remove{
    position:absolute; top:8px; right:8px; background:none; border:none;
    color: var(--stamp); font-size:13px; cursor:pointer; font-weight:600;
  }
  .add-owned{
    background: none; border: 1px dashed var(--ink-soft); border-radius: var(--radius);
    padding: 9px; width:100%; color: var(--ink-soft); font-size: 13.5px; cursor:pointer;
  }

  button.secondary{
    background: var(--paper); border: 1px solid var(--ink); border-radius: var(--radius);
    padding: 10px 16px; font-size:14px; font-weight:600; color: var(--ink); cursor:pointer;
  }
  button.danger{ color: var(--stamp); border-color: var(--stamp); background: var(--paper); border:1px solid var(--stamp); border-radius:var(--radius); padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }

  .dialog-foot .primary{
    background: transparent;
    border: 1px solid var(--stamp);
    color: var(--stamp);
    box-shadow: none;
    border-radius: 8px;
  }
  .dialog-foot .primary:hover{ background: rgba(156,59,46,0.08); }

  .dialog-foot [data-action="edit"]{
    border-color: var(--ink);
    color: var(--ink);
  }
  .dialog-foot [data-action="edit"]:hover{ background: rgba(43,36,32,0.06); }

  .dialog-foot .secondary{
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    box-shadow: none;
    border-radius: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .dialog-foot .secondary:hover{
    background: rgba(43,36,32,0.05);
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
  }
  .dialog-foot .secondary:active{ transform: translate(0,0); box-shadow: 1px 1px 0 rgba(0,0,0,0.25); }

  .dialog-foot .danger{
    background: transparent;
    border-radius: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .dialog-foot .danger:hover{
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
  }
  .dialog-foot .danger:active{ transform: translate(0,0); box-shadow: 1px 1px 0 rgba(0,0,0,0.25); }

  .detail-section{ margin-bottom: 18px; }
  .detail-section h4{ font-family: var(--serif); font-size:14.5px; border-bottom:1px solid var(--line); padding-bottom:6px; margin: 0 0 10px; }
  .detail-row{ display:flex; justify-content:space-between; font-size:13.5px; padding: 4px 0; gap: 10px; }
  .detail-row span:first-child{ color: var(--ink-soft); }
  .detail-row span:last-child{ text-align:right; font-weight:500; }
  .review-text{ font-size: 14px; line-height:1.55; font-style: italic; color: var(--ink); }
  .ownership-card{ border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; font-size:13px; }

  footer.note{ text-align:center; font-size:12px; color: var(--ink-soft); padding: 14px; }

  @media (max-width: 560px){
    header.top{ padding: 18px 16px 14px; }
    .brand .logo-main{ font-size: 28px; }
    main{ padding: 16px 12px 50px; }
    .filterbar .bar{ padding: 12px; }
    .filterbar .tabrow{ padding: 12px 12px 0; }
    .field-row{ flex-direction: column; }
  }
</style>
</head>
<body>
<div id="app" class="hidden">

  <header class="top">
    <div class="brand">

function uid(){ return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;

  let h=0;

/* ---- Hype (fiammelle) ---- */

const FLAME_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" style="display:inline-block;vertical-align:middle;" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c1.2 3.1-2.1 4.2-2.1 7.2a3.1 3.1 0 1 0 6.2 0c0-1-.4-2-1-2.9 2.1 1.3 3.9 3.9 3.9 6.9a7 7 0 1 1-14 0c0-5.3 4.1-7.2 4.1-11.2.9.9 1.9 1.1 2.9 0z"/></svg>';
function flameString(hype){
  const n = Number(hype) || 0;
  let out = '';
  for(let i=0;i<5;i++){
    out += `<span style="color:${i<n ? 'var(--brass)' : 'var(--line)'};">${FLAME_SVG}</span>`;
  }
  return `<span class="flames">${out}</span>`;
}
function ownershipSummary(g){
  const platform = g.play && g.play.platform;
  const list = g.ownership || [];
  const entry = list.find(o => o.platform === platform) || list[0];
  if(!entry) return null;
  let label = entry.format === 'fisico' ? 'Fisico' : 'Digitale';
  if(entry.format === 'digitale' && entry.drmFree) label += ' · DRM Free';
  return label;
}
function allPlatformsOf(g){
  const set = new Set();
  if(g.play && g.play.platform) set.add(g.play.platform);
  (g.ownership||[]).forEach(o=>{ if(o.platform) set.add(o.platform); });
  return Array.from(set);
}
function allPlatformsInLibrary(){
  const set = new Set();
  state.games.forEach(g => allPlatformsOf(g).forEach(p=>set.add(p)));
  return Array.from(set).sort();
}
function allGenresInLibrary(){
  const set = new Set();
  state.games.forEach(g => (g.genres||[]).forEach(x=>set.add(x)));
  return Array.from(set).sort();
}
function ownedPlatformsOf(g){
  return (g.ownership||[]).map(o=>o.platform).filter(Boolean);
}
function ownedPlatformsInLibrary(){
  const set = new Set();
  state.games.forEach(g => ownedPlatformsOf(g).forEach(p=>set.add(p)));
  return Array.from(set).sort();
}
function releasePlatformsOf(g){
  return g.releasePlatforms || [];
}
function releasePlatformsInLibrary(){
  const set = new Set();
  state.games.forEach(g => { if(isFutureRelease(g)) releasePlatformsOf(g).forEach(p=>set.add(p)); });
  return Array.from(set).sort();
}
// Scala 0–10 -> 5 stelline (stessa conversione usata da starString per le card).
function starCountOf(g){
  const r = Number(g.play && g.play.rating) || 0;
  if(!r) return 0;
  return Math.min(5, Math.max(0, Math.round(r/2)));
}
function hypeCountOf(g){

}
// Gioco che vive nella scheda "Da giocare" (stessa condizione di belongsToTab):
// serve a decidere quando mostrare/chiedere l'Hype come priorità di gioco.
function isDaGiocare(g){

}
// Categoria "vera" di un gioco, indipendente dalla tab attiva (a differenza di
// cardMode, pensata solo per decidere come disegnare la card nella tab
// corrente). Serve al filtro "Stato" della tab Tutti.
function categoryOf(g){
  if(isFutureRelease(g)) return 'in-uscita';
  if(g.isInfinite) return 'infinito';
  if(g.status) return g.status;
  if(g.wantToBuy) return 'da-comprare';
  return 'da-giocare';
}

}

/* ============ State ============ */
const PAGE_SIZE = 30;
const state = {
  games: [],
  activeTab: 'in-corso',
  // Ogni scheda ha i propri filtri indipendenti (barra "filtri per scheda"):
  // { search, sort, <chiavi dei gruppi definiti in groupsFor> }. Popolato in
  // modo pigro da getTabFilters() la prima volta che una tab viene aperta.
  filters: {},
  visibleCount: PAGE_SIZE,
  loaded: false
};
function getTabFilters(tabId){
  if(!state.filters[tabId]) state.filters[tabId] = { search:'', sort:'name-asc' };
  return state.filters[tabId];
}
let confirmDeleteId = null;
let draft = null; // used while add/edit form is open

const TABS = [
  {id:'in-corso', label:'In corso'},
  {id:'infinito', label:'Infiniti'},
  {id:'finito', label:'Finiti'},
  {id:'da-giocare', label:'Da giocare'},
  {id:'in-uscita', label:'In uscita'},
  {id:'da-comprare', label:'Da comprare'},
  {id:'tutti', label:'Tutti'}
];

/* ============ Persistence (Firestore) ============ */
// Ogni gioco è un documento separato in library/{uid}/games/{gameId}, invece
// che una riga dentro un'unica stringa JSON in library/{uid}. Vantaggi:
// - ogni salvataggio scrive SOLO il gioco modificato (pochi KB), non l'intera
//   libreria: molto più leggero e molto più difficile da far fallire;
// - il limite di 1 MiB per documento Firestore riguarda ormai il singolo
//   gioco, non più la libreria intera;
// - Firestore non impone alcun limite al numero di documenti in una
//   collezione (ne supporta milioni), quindi anche una libreria enorme non
//   può più "riempire" un singolo documento.
// library/{uid} resta come piccolo documento di metadati (flag di migrazione).
function libraryMetaRef(){
  return doc(db, 'library', currentUser.uid);
}
function gamesCollectionRef(){
  return collection(db, 'library', currentUser.uid, 'games');
}
function gameDocRef(gameId){
  return doc(db, 'library', currentUser.uid, 'games', gameId);
}

// ---- Banner di errore visibile sui salvataggi falliti ----
// Prima non c'era alcun avviso a schermo se un salvataggio falliva: l'utente
// pensava di aver salvato mentre in realtà i dati restavano solo in locale.
let saveErrorBannerEl = null;
function showSaveError(message){
  if(!saveErrorBannerEl){
    saveErrorBannerEl = document.createElement('div');
    saveErrorBannerEl.id = 'save-error-banner';
    saveErrorBannerEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;'
      + 'background:#9C3B2E;color:#F5EFDC;font-family:sans-serif;font-size:14px;font-weight:600;'
      + 'padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;'
      + 'box-shadow:0 2px 8px rgba(0,0,0,0.35);';
    document.body.appendChild(saveErrorBannerEl);
  }
  saveErrorBannerEl.innerHTML = '<span>⚠️ ' + esc(message) + '</span>'
    + '<button id="save-error-close" style="background:none;border:1px solid #F5EFDC;color:#F5EFDC;'
    + 'padding:4px 10px;border-radius:3px;cursor:pointer;flex-shrink:0;">Chiudi</button>';
  saveErrorBannerEl.style.display = 'flex';
  document.getElementById('save-error-close').addEventListener('click', ()=>{ saveErrorBannerEl.style.display = 'none'; });
}

async function loadGames(){
  try{
    const [gamesSnap, metaSnap] = await Promise.all([
      getDocs(gamesCollectionRef()),
      getDoc(libraryMetaRef())
    ]);
    const metaData = metaSnap.exists() ? metaSnap.data() : {};
    const alreadyMigrated = metaData.migrated === true;

    if(!gamesSnap.empty || alreadyMigrated){
      // Sottocollezione già in uso: la usiamo così com'è, anche se vuota
      // (es. un utente già migrato che ha cancellato tutti i giochi).
      state.games = gamesSnap.docs.map(d => d.data());
    } else if(metaSnap.exists() && metaSnap.data().games){
      // Formato precedente: un unico blob JSON in library/{uid}.
      // Lo leggiamo e lo migriamo subito alla sottocollezione, senza
      // perdere nulla di quanto già inserito.
      const oldGames = JSON.parse(metaSnap.data().games);
      state.games = oldGames;
      await migrateToSubcollection(oldGames);
    } else {
      // Primo accesso in assoluto -> seed con dati di esempio.
      state.games = seedData();
      await migrateToSubcollection(state.games);
    }
    // Alcuni campi devono essere sempre array (genres, ownership,
    // releasePlatforms): se un documento li ha in un formato diverso
    // (es. una singola stringa invece di un array, o mancanti del tutto)
    // le funzioni di filtro/rendering vanno in crash e bloccano l'intera
    // pagina (tab, filtri e griglia restano vuoti). Li normalizziamo qui,
    // prima che qualunque render() li tocchi.
    normalizeGames(state.games);
    // Allinea i dati esistenti ai campi introdotti col tempo (hype vuoto di
    // default, ecc.). Non facciamo "await": le scritture su Firestore
    // avvengono in background, così l'app si apre subito anche offline (con
    // la cache persistente un commit offline resta in attesa della rete).
    // I dati corretti sono già in memoria e vengono usati dal render().
    migrateMissingFields(state.games, metaData);
  }catch(e){
    console.error('Errore di caricamento dati', e);
    state.games = [];
    showSaveError('Impossibile caricare la libreria da Firebase. Controlla la connessione e ricarica la pagina.');
  }
  state.loaded = true;
  render();
}

// Garantisce che i campi che il resto del codice tratta sempre come array
// (genres, ownership, releasePlatforms) lo siano davvero, e che title sia
// sempre una stringa. Non scrive nulla su Firestore: corregge solo la
// copia in memoria, cosi la UI non crasha più su un documento "storto".
function normalizeGames(games){
  games.forEach(g=>{
    if(!Array.isArray(g.genres)) g.genres = g.genres ? [g.genres] : [];
    if(!Array.isArray(g.ownership)) g.ownership = g.ownership ? [g.ownership] : [];
    if(!Array.isArray(g.releasePlatforms)) g.releasePlatforms = g.releasePlatforms ? [g.releasePlatforms] : [];
    if(typeof g.title !== 'string') g.title = g.title == null ? '' : String(g.title);
  });
}

// Migrazione dei dati esistenti. Non tocca nessun campo oltre a "hype":
// - Hype ora è VUOTO (null) di default, non più 1: un gioco senza hype
//   impostato non deve sembrare "poco interessante", ma "non ancora valutato".
//   Chi non ha il campo (undefined) viene portato a null.
// - Una tantum (flag hypeDaGiocareReset sul documento di metadati): l'Hype non
//   era modificabile né visibile per i giochi "Da giocare", quindi il valore 1
//   che hanno adesso è quasi certamente il vecchio default automatico. Lo
//   svuotiamo SOLO per i giochi "Da giocare" puri (non in lista desideri, non
//   in uscita) con hype esattamente 1. Qualunque altro valore (2-5) e tutti gli
//   altri giochi restano com'erano. Per saltare questo passaggio metti a false
//   la costante qui sotto.
const RESET_LEGACY_HYPE_ON_DA_GIOCARE = true;

async function migrateMissingFields(games, meta){
  const toPersist = new Map(); // id -> gioco (evita doppioni)
  games.forEach(g => {
    if(g.hype === undefined){ g.hype = null; toPersist.set(g.id, g); }
  });

  const doLegacyReset = RESET_LEGACY_HYPE_ON_DA_GIOCARE && !(meta && meta.hypeDaGiocareReset === true);
  if(doLegacyReset){
    games.forEach(g => {
      if(isDaGiocare(g) && !g.wantToBuy && Number(g.hype) === 1){
        g.hype = null;
        toPersist.set(g.id, g);
      }
    });
  }

  if(!toPersist.size && !doLegacyReset) return;
  try{
    const list = Array.from(toPersist.values());
    const CHUNK = 450;
    for(let i=0; i<list.length; i+=CHUNK){
      const batch = writeBatch(db);
      // merge:true + solo il campo hype: gli altri campi del documento non vengono riscritti.
      list.slice(i, i+CHUNK).forEach(g => batch.set(gameDocRef(g.id), { hype: g.hype }, { merge: true }));
      await batch.commit();
    }
    // Segna la pulizia come fatta solo se le scritture sono andate a buon fine.
    if(doLegacyReset){
      await setDoc(libraryMetaRef(), { hypeDaGiocareReset: true }, { merge: true });
    }
  }catch(e){
    console.error('Errore di migrazione del campo hype', e);
    showSaveError('Non sono riuscito a salvare la migrazione del campo Hype su alcuni giochi. I dati restano corretti in locale: riprova più tardi.');
  }
}

// Scrive ogni gioco come documento separato nella sottocollezione (a lotti da
// max 450 scritture, sotto il limite Firestore di 500 per batch — copre
// senza problemi anche librerie da migliaia di voci), poi marca il vecchio
// documento come migrato e ne svuota il blob JSON pesante.
async function migrateToSubcollection(games){
  try{
    const CHUNK = 450;
    for(let i=0; i<games.length; i+=CHUNK){
      const batch = writeBatch(db);
      games.slice(i, i+CHUNK).forEach(g => batch.set(gameDocRef(g.id), g));
      await batch.commit();
    }
    await setDoc(libraryMetaRef(), { migrated: true, migratedAt: Date.now(), games: null }, { merge: true });
  }catch(e){
    console.error('Errore di migrazione alla sottocollezione', e);
    showSaveError('La migrazione della libreria al nuovo formato non è riuscita del tutto. I dati che vedi restano al sicuro in locale: segnalalo e ricarica la pagina per riprovare.');
  }
}

// Salva UN SOLO gioco (creazione o modifica): non riscrive più l'intera
// libreria ad ogni salvataggio.
async function persistGame(game){
  try{
    await setDoc(gameDocRef(game.id), game);
  }catch(e){
    console.error('Errore di salvataggio', e);
    showSaveError('Salvataggio non riuscito: le modifiche a "' + (game.title || 'questo gioco') + '" potrebbero non essere state salvate su Firebase. Riprova.');
  }
}

// Elimina un gioco dalla sottocollezione.
async function deleteGamePersisted(gameId){
  try{
    await deleteDoc(gameDocRef(gameId));
  }catch(e){
    console.error('Errore di eliminazione', e);
    showSaveError('Eliminazione non riuscita: il gioco potrebbe essere ancora presente su Firebase. Riprova.');
  }
}

/* ============ Derived data / filters ============ */
// ---- Definizione dei gruppi di filtro per ciascuna scheda ----
// Ogni gruppo sa disegnarsi da solo (type/label/options) e sa dire se un gioco
// lo soddisfa (match). "key" è la chiave usata dentro state.filters[tab].
function chipsGroup(key,label,options,match,icon){ return {type:'chips', key, label, options, match, icon}; }
function segGroup(key,label,options,def,match){ return {type:'seg', key, label, options, default:def, match}; }
function selGroup(key,label,options,match){ return {type:'sel', key, label, options, match}; }
function numGroup(key,label,placeholder,match){ return {type:'num', key, label, placeholder, match}; }

function groupsFor(tabId){
  const genreGroup = chipsGroup('genres','Genere', allGenresInLibrary(),
    (g,sel)=> !sel.length || (g.genres||[]).some(x=>sel.includes(x)));
  const platformGroup = (label)=> chipsGroup('platforms', label||'Piattaforma', allPlatformsInLibrary(),
    (g,sel)=> !sel.length || allPlatformsOf(g).some(x=>sel.includes(x)));
  const votoGroup = chipsGroup('voto','Voto', [1,2,3,4,5],
    (g,sel)=> !sel.length || sel.map(Number).includes(starCountOf(g)), 'star');
  const hypeGroup = chipsGroup('hype','Hype', [1,2,3,4,5],
    (g,sel)=> !sel.length || sel.map(Number).includes(hypeCountOf(g)), 'flame');

  if(tabId === 'finito'){
    return [
      genreGroup, platformGroup(), votoGroup,
      numGroup('annoCompletamento','Anno completamento','Es. 2025',
        (g,val)=> !String(val||'').trim() || ((g.play && g.play.endDate || '').slice(0,4) === String(val).trim())),
      segGroup('stato','Stato', ['Tutti','Completati','Abbandonati'], 'Tutti', (g,val)=>{
        if(val==='Abbandonati') return !!g.abandoned;
        if(val==='Completati') return !g.abandoned;
        return true;
      })
    ];
  }
  if(tabId === 'in-uscita'){
    return [
      genreGroup,
      chipsGroup('releasePlatforms','Piattaforma di uscita', releasePlatformsInLibrary(),
        (g,sel)=> !sel.length || releasePlatformsOf(g).some(x=>sel.includes(x))),
      hypeGroup,
      segGroup('prenotato','Prenotato', ['Tutti','Sì','No'], 'Tutti', (g,val)=>{
        if(val==='Sì') return !!g.preorder;
        if(val==='No') return !g.preorder;
        return true;
      }),
      selGroup('entro','Entro', ['Qualsiasi data','Prossimi 30 giorni','Prossimi 90 giorni',"Quest'anno"], (g,val)=>{
        if(val==='Qualsiasi data') return true;
        if(!g.releaseDate) return false;
        const rd = new Date(g.releaseDate);
        if(isNaN(rd.getTime())) return false;
        if(val==="Quest'anno") return rd.getFullYear() === new Date().getFullYear();
        const days = val==='Prossimi 30 giorni' ? 30 : 90;
        const diffDays = (rd - new Date()) / 86400000;
        return diffDays >= 0 && diffDays <= days;
      })
    ];
  }
  if(tabId === 'da-comprare'){
    return [
      genreGroup, hypeGroup,
      segGroup('stato','Stato', ['Tutti','Già giocati','Non ancora giocati'], 'Tutti', (g,val)=>{
        if(val==='Tutti') return true;
        const played = g.status === 'finito' || g.status === 'in-corso';
        return val==='Già giocati' ? played : !played;
      }),
      selGroup('fasciaPrezzo','Fascia di prezzo', ['Qualsiasi prezzo','Sotto 20€','20–40€','40–60€','Oltre 60€'], (g,val)=>{
        if(val==='Qualsiasi prezzo') return true;
        const p = Number(g.wishlistPrice);
        if(g.wishlistPrice==null || isNaN(p)) return false;
        if(val==='Sotto 20€') return p < 20;
        if(val==='20–40€') return p >= 20 && p < 40;
        if(val==='40–60€') return p >= 40 && p < 60;
        if(val==='Oltre 60€') return p >= 60;
        return true;
      })
    ];
  }
  if(tabId === 'in-corso'){
    return [
      genreGroup, platformGroup(),
      segGroup('accessType','Tipo accesso', ['Tutti','Posseduto','Abbonamento'], 'Tutti', (g,val)=>{
        if(val==='Tutti') return true;
        const t = g.play && g.play.accessType;
        return val==='Posseduto' ? t==='owned' : (!!t && t!=='owned');
      })
    ];
  }
  if(tabId === 'infinito'){
    return [genreGroup, platformGroup(), votoGroup];
  }
  if(tabId === 'da-giocare'){
    return [
      genreGroup, hypeGroup,
      chipsGroup('ownedPlatforms','Piattaforma posseduta', ownedPlatformsInLibrary(),
        (g,sel)=> !sel.length || ownedPlatformsOf(g).some(x=>sel.includes(x))),
      segGroup('formato','Formato', ['Tutti','Digitale','Fisico'], 'Tutti', (g,val)=>{
        if(val==='Tutti') return true;
        const fmt = val==='Digitale' ? 'digitale' : 'fisico';
        return (g.ownership||[]).some(o=>o.format===fmt);
      })
    ];
  }
  // tutti
  return [
    genreGroup, platformGroup(),
    segGroup('stato','Stato', ['Tutti','In corso','Finiti','Da giocare','In uscita','Da comprare','Infiniti','Solo in collezione'], 'Tutti', (g,val)=>{
      if(val==='Tutti') return true;
      const map = {'In corso':'in-corso','Finiti':'finito','Da giocare':'da-giocare','In uscita':'in-uscita','Da comprare':'da-comprare','Infiniti':'infinito','Solo in collezione':'solo-collezione'};
      return categoryOf(g) === map[val];
    })
  ];
}
// Ordinamento disponibile per scheda: solo per nome su "In corso", per nome
// o voto sulle altre.
function sortOptionsFor(tabId){
  const base = [
    { value:'name-asc', label:'Nome (A - Z)' },
    { value:'name-desc', label:'Nome (Z - A)' }
  ];
  const options = tabId === 'in-corso' ? base.slice() : base.concat([
    { value:'rating-desc', label:'Voto (più alto)' },
    { value:'rating-asc', label:'Voto (più basso)' }
  ]);
  // In "Da giocare" l'Hype è la priorità di gioco: permette di ordinare per quella.
  if(tabId === 'da-giocare'){
    options.push(
      { value:'hype-desc', label:'Hype (più alto)' },
      { value:'hype-asc', label:'Hype (più basso)' }
    );
  }
  options.push(
    { value:'release-desc', label:'Data uscita (più recente)' },
    { value:'release-asc', label:'Data uscita (meno recente)' },
    { value:'start-desc', label:'Data inizio (più recente)' },
    { value:'start-asc', label:'Data inizio (meno recente)' },
    { value:'end-desc', label:'Data fine (più recente)' },
    { value:'end-asc', label:'Data fine (meno recente)' }
  );
  return options;
}
function matchesTabFilters(g, tabId, groups){
  const tf = getTabFilters(tabId);
  const s = (tf.search||'').trim().toLowerCase();
  if(s && !g.title.toLowerCase().includes(s)) return false;
  // tf[grp.key] esiste solo dopo che il pannello filtri di QUESTA tab è
  // stato disegnato almeno una volta (renderPanel lo inizializza lì).
  // Ma renderTabs() calcola i conteggi per TUTTE le tab (anche quelle mai
  // aperte in questa sessione, dato che i filtri non vengono persistiti),
  // quindi qui serve comunque un default sensato per non leggere proprietà
  // di "undefined" e mandare in crash l'intero render().
  // "groups" può arrivare già calcolato dal chiamante (vedi getFilteredTabGames):
  // evita di rifare groupsFor(tabId) — che scandisce l'intera libreria per
  // generi/piattaforme — una volta per CIASCUN gioco filtrato.
  return (groups || groupsFor(tabId)).every(grp => {
    let val = tf[grp.key];
    if(val === undefined){
      val = grp.type === 'chips' ? [] : grp.type === 'seg' ? grp.default : grp.type === 'num' ? '' : grp.options[0];
    }
    return grp.match(g, val);
  });
}
// Un gioco è "non ancora uscito" se ha una data di uscita valida e futura.
// Le date sono stringhe 'YYYY-MM-DD' (dall'input type="date"): il confronto
// come stringhe è già cronologicamente corretto, senza problemi di fuso orario.
function isFutureRelease(g){
  if(!g.releaseDate) return false;
  const d = new Date(g.releaseDate);
  if(isNaN(d.getTime())) return false;
  const todayStr = new Date().toISOString().slice(0,10);
  return g.releaseDate > todayStr;
}
function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });
}
function belongsToTab(g, tabId){
  if(tabId === 'tutti') return true;
  if(tabId === 'in-uscita') return isFutureRelease(g);
  if(isFutureRelease(g)) return false; // i giochi non ancora usciti vivono solo in "In uscita"
  if(tabId === 'da-comprare') return !!g.wantToBuy;
  if(tabId === 'infinito') return !!g.isInfinite;
  if(g.isInfinite) return false; // infinite games live only in their own tab (+ Tutti / Da comprare)
  return g.status === tabId;
}
// Estrae la data richiesta (releaseDate sta sul gioco, startDate/endDate
// dentro play) solo se valida; altrimenti null, così chi non ce l'ha finisce
// sempre in fondo indipendentemente dal verso scelto. Le date sono stringhe
// 'YYYY-MM-DD': il confronto lessicografico è già cronologicamente corretto.
function dateValueOf(g, field){
  const raw = field === 'releaseDate' ? g.releaseDate : (g.play && g.play[field]);
  return raw && !isNaN(new Date(raw).getTime()) ? raw : null;
}
function byDateField(field, dir){
  return (a,b)=>{
    const da = dateValueOf(a, field), db = dateValueOf(b, field);
    if(da == null && db == null) return 0;
    if(da == null) return 1;
    if(db == null) return -1;
    if(da === db) return 0;
    const cmp = da < db ? -1 : 1;
    return dir === 'asc' ? cmp : -cmp;
  };
}
function sortByUserChoice(list, tabId){
  const sort = getTabFilters(tabId).sort;
  const sorted = list.slice();
  if(sort === 'name-desc'){
    sorted.sort((a,b)=> (b.title||'').localeCompare(a.title||'', 'it', { sensitivity:'base' }));
  } else if(sort === 'rating-desc'){
    sorted.sort((a,b)=> (Number(b.play && b.play.rating) || 0) - (Number(a.play && a.play.rating) || 0));
  } else if(sort === 'rating-asc'){
    sorted.sort((a,b)=> (Number(a.play && a.play.rating) || 0) - (Number(b.play && b.play.rating) || 0));
  } else if(sort === 'hype-desc' || sort === 'hype-asc'){
    // Chi non ha hype impostato finisce sempre in fondo, in entrambi i versi;
    // a parità di hype, ordine alfabetico.
    const dir = sort === 'hype-desc' ? -1 : 1;
    const byTitle = (a,b)=> (a.title||'').localeCompare(b.title||'', 'it', { sensitivity:'base' });
    sorted.sort((a,b)=>{
      const ha = hypeCountOf(a), hb = hypeCountOf(b);
      if(!ha && !hb) return byTitle(a,b);
      if(!ha) return 1;
      if(!hb) return -1;
      if(ha !== hb) return (ha - hb) * dir;
      return byTitle(a,b);
    });
  } else if(sort === 'release-desc'){
    sorted.sort(byDateField('releaseDate','desc'));
  } else if(sort === 'release-asc'){
    sorted.sort(byDateField('releaseDate','asc'));
  } else if(sort === 'start-desc'){
    sorted.sort(byDateField('startDate','desc'));
  } else if(sort === 'start-asc'){
    sorted.sort(byDateField('startDate','asc'));
  } else if(sort === 'end-desc'){
    sorted.sort(byDateField('endDate','desc'));
  } else if(sort === 'end-asc'){
    sorted.sort(byDateField('endDate','asc'));
  } else {
    sorted.sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'it', { sensitivity:'base' })); // name-asc (default)
  }
  return sorted;
}
// Solo filtro (niente ordinamento): usato per i conteggi nelle tab, dove
// l'ordine dei risultati non serve, e come base di getTabGames qui sotto.
// groupsFor(tabId) viene calcolato una sola volta per l'intera chiamata,
// invece che una volta per ogni gioco (vedi matchesTabFilters).
function getFilteredTabGames(tabId){
  const groups = groupsFor(tabId);
  return state.games.filter(g => belongsToTab(g, tabId) && matchesTabFilters(g, tabId, groups));
}
function getTabGames(tabId){
  return sortByUserChoice(getFilteredTabGames(tabId), tabId);
}

/* ============ Rendering ============ */
function render(){
  if(!state.loaded) return;
  try{
    renderStats();
    renderTabs();
    renderFilterBar();
    renderGrid();
  }catch(e){
    // Prima, un errore qui bloccava il rendering senza lasciare traccia
    // visibile: tab, pannello filtri e griglia restavano vuoti e basta.
    // Ora l'errore viene mostrato a schermo (e loggato in console) così
    // si vede subito cosa si è rotto, invece di uno schermo cieco.
    console.error('Errore di rendering', e);
    showSaveError('Errore nel disegnare la pagina: ' + (e && e.message ? e.message : e));
  }
}

function renderStats(){
  const year = new Date().getFullYear();
  const totalGames = state.games.length;
  const totalHours = state.games.reduce((s,g)=> s + (Number(g.play && g.play.hours) || 0), 0);
  const finishedThisYear = state.games.filter(g => g.status==='finito' && g.play && g.play.endDate && g.play.endDate.startsWith(String(year))).length;
  const ratings = state.games.map(g=> g.play && Number(g.play.rating)).filter(r=> r>0);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '—';
  const wishlistSpend = state.games.filter(g=>g.wantToBuy && g.wishlistPrice).reduce((s,g)=> s + Number(g.wishlistPrice||0), 0);
  const librarySpend = state.games.reduce((s,g)=> s + (g.ownership||[]).reduce((s2,o)=> s2 + Number(o.price||0), 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="n">${totalGames}</span><span class="l">giochi archiviati</span></div>
    <div class="stat"><span class="n">${Math.round(totalHours * 100) / 100}h</span><span class="l">ore totali giocate</span></div>
    <div class="stat"><span class="n">${finishedThisYear}</span><span class="l">finiti nel ${year}</span></div>
    <div class="stat"><span class="n">${avgRating}</span><span class="l">voto medio</span></div>
    <div class="stat"><span class="n">€${librarySpend.toFixed(2)}</span><span class="l">costo libreria</span></div>
    <div class="stat"><span class="n">€${wishlistSpend.toFixed(2)}</span><span class="l">costo wishlist</span></div>
  `;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const count = getFilteredTabGames(t.id).length;
    const active = state.activeTab === t.id ? ' on' : '';
    return `<button type="button" class="tabbtn${active}" data-tab="${t.id}">${t.label}<span class="count">${count}</span></button>`;
  }).join('');
}

// Ricostruisce l'intera barra (ricerca, ordinamento, pannello filtri) per la
// tab attualmente attiva. Va richiamata quando cambia la tab attiva o quando
// i dati sottostanti (generi/piattaforme in libreria) possono essere
// cambiati (es. dopo un salvataggio) — non durante la digitazione nei campi
// del pannello, per non perdere focus/cursore (vedi renderChipsAndBadge).
function renderFilterBar(){
  const tabId = state.activeTab;
  const tf = getTabFilters(tabId);

  const searchInput = document.getElementById('filter-search');
  if(document.activeElement !== searchInput){ searchInput.value = tf.search || ''; }

  const sortOptions = sortOptionsFor(tabId);
  if(!sortOptions.some(o=>o.value===tf.sort)) tf.sort = sortOptions[0].value;
  document.getElementById('filter-sort').innerHTML = sortOptions
    .map(o=>`<option value="${o.value}" ${o.value===tf.sort?'selected':''}>${o.label}</option>`).join('');

  renderPanel();
}

// Ridisegna il pannello filtri "a tendina" della tab attiva a partire dallo
// stato salvato in state.filters[tab], inizializzando i valori mancanti al
// primo utilizzo di ciascun gruppo.
function renderPanel(){
  const tabId = state.activeTab;
  const tf = getTabFilters(tabId);
  const groups = groupsFor(tabId);
  const panel = document.getElementById('filter-panel');

  panel.innerHTML = groups.map(g=>{
    if(g.type === 'chips'){
      if(tf[g.key] === undefined) tf[g.key] = [];
      const selected = tf[g.key];
      const opts = g.options.length ? g.options.map(o=>{
        const val = String(o);
        const on = selected.includes(val);
        if(g.icon){
          return `<button type="button" class="opt iconopt${on?' on':''}" data-value="${esc(val)}" aria-label="${esc(g.label)} ${esc(val)}"><i class="ti ti-${g.icon}" aria-hidden="true"></i></button>`;
        }
        return `<button type="button" class="opt${on?' on':''}" data-value="${esc(val)}">${esc(val)}</button>`;
      }).join('') : `<p class="hint" style="margin:0;">Nessuna opzione disponibile ancora.</p>`;
      return `<div class="group" data-kind="chips" data-key="${g.key}"><label>${esc(g.label)}</label><div class="optrow">${opts}</div></div>`;
    }
    if(g.type === 'seg'){
      if(tf[g.key] === undefined) tf[g.key] = g.default;
      return `<div class="group" data-kind="seg" data-key="${g.key}" data-default="${esc(g.default)}"><label>${esc(g.label)}</label><div class="optrow">${
        g.options.map(o=>`<button type="button" class="opt${o===tf[g.key]?' on':''}" data-value="${esc(o)}">${esc(o)}</button>`).join('')
      }</div></div>`;
    }
    if(g.type === 'num'){
      if(tf[g.key] === undefined) tf[g.key] = '';
      return `<div class="group" data-kind="num" data-key="${g.key}"><label>${esc(g.label)}</label><input type="number" inputmode="numeric" class="yearinput" placeholder="${esc(g.placeholder)}" value="${esc(tf[g.key])}"></div>`;
    }
    // sel
    if(tf[g.key] === undefined) tf[g.key] = g.options[0];
    return `<div class="group" data-kind="sel" data-key="${g.key}"><label>${esc(g.label)}</label><select class="groupsel">${
      g.options.map(o=>`<option ${o===tf[g.key]?'selected':''}>${esc(o)}</option>`).join('')
    }</select></div>`;
  }).join('');

  renderChipsAndBadge(groups);
}

// Aggiorna SOLO il badge col conteggio e la fila di chip rimovibili, senza
// toccare il resto del pannello: può essere chiamata ad ogni tasto premuto
// (es. nel campo "Anno completamento") senza far perdere il focus all'input.
function renderChipsAndBadge(groups){
  const tabId = state.activeTab;
  const tf = getTabFilters(tabId);
  // Se il chiamante (renderPanel) ha già i gruppi pronti per questa tab, li
  // riusiamo invece di rifare da capo la scansione della libreria.
  if(!groups) groups = groupsFor(tabId);
  let count = 0;
  const chipItems = [];

  groups.forEach(g=>{
    if(g.type === 'chips'){
      (tf[g.key] || []).forEach(val=>{
        count++;
        chipItems.push({ label:`${g.label}: ${val}`, reset:()=>{ tf[g.key] = tf[g.key].filter(v=>v!==val); renderPanel(); refreshTabsAndGrid(); } });
      });
    } else if(g.type === 'seg'){
      if(tf[g.key] !== undefined && tf[g.key] !== g.default){
        count++;
        chipItems.push({ label:`${g.label}: ${tf[g.key]}`, reset:()=>{ tf[g.key] = g.default; renderPanel(); refreshTabsAndGrid(); } });
      }
    } else if(g.type === 'sel'){
      if(tf[g.key] !== undefined && tf[g.key] !== g.options[0]){
        count++;
        chipItems.push({ label:`${g.label}: ${tf[g.key]}`, reset:()=>{ tf[g.key] = g.options[0]; renderPanel(); refreshTabsAndGrid(); } });
      }
    } else if(g.type === 'num'){
      if((tf[g.key]||'').toString().trim() !== ''){
        count++;
        chipItems.push({ label:`${g.label}: ${tf[g.key]}`, reset:()=>{ tf[g.key] = ''; renderPanel(); refreshTabsAndGrid(); } });
      }
    }
  });

  const badge = document.getElementById('filter-badge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-block' : 'none';

  const chipsEl = document.getElementById('filter-chips');
  chipsEl.innerHTML = '';
  chipItems.forEach(ci=>{
    const el = document.createElement('span');
    el.className = 'chip';
    el.innerHTML = `<span>${esc(ci.label)}</span><i class="ti ti-x" role="button" tabindex="0" aria-label="Rimuovi filtro"></i>`;
    el.querySelector('i').addEventListener('click', ci.reset);
    chipsEl.appendChild(el);
  });
  if(count > 0){
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clear-filters';
    clearBtn.textContent = 'Azzera tutti';
    clearBtn.addEventListener('click', ()=>{
      groups.forEach(g=>{
        if(g.type === 'chips') tf[g.key] = [];
        else if(g.type === 'seg') tf[g.key] = g.default;
        else if(g.type === 'sel') tf[g.key] = g.options[0];
        else if(g.type === 'num') tf[g.key] = '';
      });
      renderPanel();
      refreshTabsAndGrid();
    });
    chipsEl.appendChild(clearBtn);
  }
}

// Da richiamare dopo qualunque modifica ai filtri: azzera la paginazione e
// ridisegna i conteggi delle tab + la griglia delle card.
function refreshTabsAndGrid(){
  state.visibleCount = PAGE_SIZE;
  renderTabs();
  renderGrid();
}


// Determina la "modalità" con cui disegnare la card: coincide con la tab
// attiva, tranne che in "Tutti" dove va dedotta dal singolo gioco.
function cardMode(g){
  const tab = state.activeTab;
  if(tab !== 'tutti') return tab;
  if(isFutureRelease(g)) return 'in-uscita';
  if(g.isInfinite) return 'infinito';
  if(g.status) return g.status;
  if(g.wantToBuy) return 'da-comprare';
  return 'da-giocare';
}
const BORDER_CLASS_BY_MODE = {
  'in-corso':'b-in-corso', 'infinito':'b-infinito', 'finito':'b-finito',
  'da-giocare':'b-da-giocare', 'in-uscita':'b-in-uscita', 'da-comprare':'b-comprare',
  'solo-collezione':'b-collezione'
};

function cardTemplate(g){
  const badges = [];
  const sl = statusLabel(g);
  if(sl) badges.push(`<span class="badge ${statusClass(g)}">${sl}</span>`);
  if(isFutureRelease(g)) badges.push(`<span class="badge in-uscita">In uscita</span>`);
  if(g.wantToBuy) badges.push(`<span class="badge comprare">Da comprare</span>`);
  if(isFutureRelease(g) && g.preorder) badges.push(`<span class="badge prenotato">Prenotato</span>`);
  if(g.status === 'finito' && g.abandoned) badges.push(`<span class="badge abbandonato">Abbandonato</span>`);

  const platforms = allPlatformsOf(g);
  const dots = platforms.map(p => `<span class="dot"><i style="background:${hashColor(p)}"></i>${esc(p)}</span>`).join('');

  const mode = cardMode(g);
  const borderClass = BORDER_CLASS_BY_MODE[mode] || 'b-da-giocare';
  const rows = [];

  if(mode === 'in-uscita'){
    rows.push(`<div class="row"><span>Uscita</span><span>${formatDate(g.releaseDate)}</span></div>`);
    rows.push(`<div class="row"><span>Piattaforme</span><span>${esc((g.releasePlatforms||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Costo</span><span>${g.preorderPrice!=null && g.preorderPrice!=='' ? '€'+Number(g.preorderPrice).toFixed(2) : '—'}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Prenotato: <b style="color:var(--ink);">${g.preorder?'Sì':'No'}</b></span>${flameString(g.hype)}</div>`);

  } else if(mode === 'da-comprare'){
    rows.push(`<div class="row"><span>Prezzo desiderato</span><span>${g.wishlistPrice ? '€'+Number(g.wishlistPrice).toFixed(2) : '—'}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Uscita</span><span>${formatDate(g.releaseDate)}</span></div>`);
    rows.push(`<div class="row"><span>Hype</span>${flameString(g.hype)}</div>`);

  } else if(mode === 'da-giocare'){
    const ownedPlatforms = (g.ownership||[]).map(o=>o.platform).filter(Boolean);
    rows.push(`<div class="row"><span>Posseduto su</span><span>${esc(ownedPlatforms.join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Uscita</span><span>${formatDate(g.releaseDate)}</span></div>`);
    rows.push(`<div class="row"><span>Hype</span>${flameString(g.hype)}</div>`);

  } else if(mode === 'solo-collezione'){
    // Nessuna scheda dedicata: compare solo in "Tutti".
    const ownedPlatforms = (g.ownership||[]).map(o=>o.platform).filter(Boolean);
    rows.push(`<div class="row"><span>Posseduto su</span><span>${esc(ownedPlatforms.join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Uscita</span><span>${formatDate(g.releaseDate)}</span></div>`);

  } else if(mode === 'in-corso'){
    const playedLine = g.play && g.play.platform
      ? esc(g.play.platform) + (g.play.accessType && g.play.accessType!=='owned' ? ' · ' + accessLabel(g.play.accessType) : '')
      : '—';
    rows.push(`<div class="row"><span>In gioco su</span><span>${playedLine}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Posseduto</span><span>${ownershipSummary(g) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Iniziato il</span><span>${formatDate(g.play && g.play.startDate)}</span></div>`);

  } else if(mode === 'finito'){
    const playedLine = g.play && g.play.platform
      ? esc(g.play.platform) + (g.play.accessType && g.play.accessType!=='owned' ? ' · ' + accessLabel(g.play.accessType) : '')
      : '—';
    rows.push(`<div class="row"><span>Giocato su</span><span>${playedLine}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Periodo</span><span>${formatDate(g.play && g.play.startDate)} – ${formatDate(g.play && g.play.endDate)}</span></div>`);
    rows.push(`<div class="row"><span>Ore</span><span>${(g.play && g.play.hours) ? g.play.hours + ' h' : '—'}</span></div>`);
    rows.push(`<div class="row"><span>Voto</span><span class="stars">${starString(g.play && g.play.rating)}</span></div>`);

  } else { // infinito (o fallback)
    const playedLine = g.play && g.play.platform
      ? esc(g.play.platform) + (g.play.accessType && g.play.accessType!=='owned' ? ' · ' + accessLabel(g.play.accessType) : '')
      : '—';
    rows.push(`<div class="row"><span>Giocato su</span><span>${playedLine}</span></div>`);
    rows.push(`<div class="row"><span>Genere</span><span>${esc((g.genres||[]).join(', ')) || '—'}</span></div>`);
    rows.push(`<div class="row"><span>Ore</span><span>${(g.play && g.play.hours) ? g.play.hours + ' h' : '—'}</span></div>`);
    rows.push(`<div class="row"><span>Voto</span><span class="stars">${starString(g.play && g.play.rating)}</span></div>`);
  }

  return `
    <div class="card ${borderClass}" data-id="${g.id}">
      <div class="card-top">
        <h3 class="card-title">${esc(g.title)}</h3>
      </div>
      ${badges.length ? `<div class="badges-row">${badges.join('')}</div>` : ''}
      <div class="card-meta">
        ${rows.join('')}
      </div>
      ${dots ? `<div class="card-tags">${dots}</div>` : ''}
    </div>
  `;
}

function renderGrid(){
  const list = getTabGames(state.activeTab);
  const grid = document.getElementById('grid');
  const loadMoreWrap = document.getElementById('load-more-wrap');
  if(list.length === 0){
    loadMoreWrap.innerHTML = '';
    loadMoreWrap.classList.add('hidden');
    let msg = 'Nessun gioco qui per ora.';
    if(state.activeTab==='da-giocare') msg = "Lo scaffale dei giochi in attesa è vuoto.";
    if(state.activeTab==='da-comprare') msg = "Nessun gioco in lista desideri al momento.";
    if(state.activeTab==='finito') msg = "Non hai ancora segnato giochi finiti.";
    if(state.activeTab==='in-corso') msg = "Non stai giocando niente al momento.";
    if(state.activeTab==='infinito') msg = "Nessun gioco senza fine (roguelike, live-service…) in archivio.";
    if(state.activeTab==='in-uscita') msg = "Nessun gioco in arrivo al momento.";
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <h3>Vuoto, per ora</h3>
      <p>${msg}</p>
      <button class="primary" id="empty-add">+ Aggiungi gioco</button>
    </div>`;
    document.getElementById('empty-add').addEventListener('click', ()=> openForm(null));
    return;
  }

  const visible = list.slice(0, state.visibleCount);
  grid.innerHTML = visible.map(cardTemplate).join('');
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.dataset.id));
  });

  if(list.length > visible.length){
    loadMoreWrap.innerHTML = `
      <p class="load-more-count">Mostrati ${visible.length} di ${list.length}</p>
      <button class="secondary" id="btn-load-more">Carica altri ${Math.min(PAGE_SIZE, list.length - visible.length)}</button>
    `;
    loadMoreWrap.classList.remove('hidden');
    document.getElementById('btn-load-more').addEventListener('click', ()=>{
      state.visibleCount += PAGE_SIZE;
      renderGrid();
    });
  } else {
    loadMoreWrap.innerHTML = '';
    loadMoreWrap.classList.add('hidden');
  }
}

        <div class="detail-row"><span>Tipo</span><span>${g.isInfinite ? 'Infinito / senza fine (roguelike, live-service…)' : 'Con una fine'}</span></div>
      </div>

      <div class="detail-section">
        <h4>Informazioni di gioco</h4>
        ${playSection}
      </div>

      <div class="detail-section">
        <h4>Copie possedute</h4>
        ${ownershipHtml}
      </div>

      ${g.wantToBuy ? `
      <div class="detail-section">
        <h4>Lista desideri</h4>
        <div class="detail-row"><span>Prezzo desiderato</span><span>${g.wishlistPrice ? '€'+Number(g.wishlistPrice).toFixed(2) : '—'}</span></div>
        <div class="detail-row"><span>Hype</span><span>${flameString(g.hype)}</span></div>
      </div>` : ''}

      ${isDaGiocare(g) && !g.wantToBuy ? `

        <h4>Priorità di gioco</h4>
        <div class="detail-row"><span>Hype</span><span>${flameString(g.hype)}</span></div>

      ${isFutureRelease(g) ? `
      <div class="detail-section">

        <div class="detail-row"><span>Costo prenotazione / previsto</span><span>${g.preorderPrice!=null && g.preorderPrice!=='' ? '€'+Number(g.preorderPrice).toFixed(2) : '—'}</span></div>

function closeDetail(){ document.getElementById('overlay-detail').classList.add('hidden'); }

/* ============ Confirm delete ============ */

  const g = state.games.find(x=>x.id===id);

  document.getElementById('confirm-text').textContent = `Stai per eliminare "${g.title}" dalla tua ludoteca. L'azione non si può annullare.`;

/* ============ Add/Edit form ============ */
function blankGame(){
  return {

    preorder:false, preorderPrice:null, releasePlatforms:[], hype:null,

function openForm(id){

      <div class="field">
        <label>Quanto interesse hai?</label>
        <select data-field="hype">
          <option value="" ${!g.hype?'selected':''}>ND</option>
          <option value="1" ${g.hype==1?'selected':''}>${HYPE_LABELS[1]}</option>
          <option value="2" ${g.hype==2?'selected':''}>${HYPE_LABELS[2]}</option>
          <option value="3" ${g.hype==3?'selected':''}>${HYPE_LABELS[3]}</option>
          <option value="4" ${g.hype==4?'selected':''}>${HYPE_LABELS[4]}</option>
          <option value="5" ${g.hype==5?'selected':''}>${HYPE_LABELS[5]}</option>
        </select>
      </div>
      <p class="hint" style="margin-bottom:0;">Verrà mostrato come fiammelle nelle card "In uscita", "Da comprare" e "Da giocare"</p>
    </fieldset>` : ''}

    ${(g._isNew || isFutureRelease(g)) ? `
    <fieldset>
      <legend>In arrivo</legend>
      <div class="checkbox-row">
        <input type="checkbox" id="f-preorder" data-field="preorder" ${g.preorder?'checked':''}>
        <label for="f-preorder">Prenotato?</label>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Costo prenotazione / prezzo previsto (€)</label>
          <input type="number" min="0" step="0.01" data-field="preorderPrice" value="${g.preorderPrice!=null?g.preorderPrice:''}">
        </div>
        <div class="field">
          <label>Disponibilità / Piattaforma Acquisto (Se più di una separarle con la virgola)</label>
          <input type="text" list="dl-platform" data-field="__releasePlatforms" value="${esc((g.releasePlatforms||[]).join(', '))}" placeholder="PC, PS5, Switch…">
        </div>
      </div>
    </fieldset>` : ''}

    <fieldset>
      <legend>Note generali</legend>
      <div class="field">
        <textarea data-field="notes" placeholder="Note libere sul gioco…">${esc(g.notes)}</textarea>
      </div>
    </fieldset>
  `;
}

function onFormFieldChange(e){
  const t = e.target;
  if(t.matches('[data-own]')){
    const idx = Number(t.dataset.ownIndex);
    const key = t.dataset.own;
    let val = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? (t.value===''? null : Number(t.value)) : t.value);
    draft.ownership[idx][key] = val;
    if(e.type === 'change' && key === 'format'){ renderFormBody(); }
    return;
  }
  if(!t.matches('[data-field]')) return;
  const field = t.dataset.field;

  // Fix bug date: mentre si digitano le cifre di un input type="date" (es. si
  // sta riscrivendo solo l'anno), finché la data non è completa il browser
  // segnala validity.badInput=true e restituisce value==='' anche se l'utente
  // NON ha svuotato il campo, ha solo finito di scrivere. Se in quel momento
  // parte un evento 'change' (basta che il focus si sposti un attimo, cosa
  // frequente su mobile), senza questo controllo salveremmo '' nella bozza e
  // subito dopo ridisegneremmo l'intero form: l'input verrebbe sostituito con
  // uno vuoto, "azzerando" la data a metà digitazione. Qui ignoriamo l'evento
  // finché l'input non è completo (o è stato svuotato davvero).
  if(t.type === 'date' && t.validity && t.validity.badInput){
    return;
  }

  if(field === '__genres'){
    draft.genres = t.value.split(',').map(s=>s.trim()).filter(Boolean);
    return;
  }
  if(field === '__releasePlatforms'){
    draft.releasePlatforms = t.value.split(',').map(s=>s.trim()).filter(Boolean);
    return;
  }
  let val;
  if(t.type === 'checkbox') val = t.checked;
  else if(t.type === 'number') val = t.value==='' ? 0 : Number(t.value);
  else if(field === 'hype') val = t.value === '' ? null : Number(t.value);
  else val = t.value;

  setPath(draft, field, val);

  // Fix bug date (2/2): con l'anno a 4 cifre, anche digitando UNA sola cifra
  // il valore risultante è comunque "tecnicamente" una data valida (es. anno
  // "0002" mentre si sta ancora scrivendo "2026"): niente badInput, ma il
  // valore è provvisorio e sbagliato. Se a ogni 'change' ridisegnassimo tutto
  // il form, l'input verrebbe sostituito a metà digitazione con quel valore
  // provvisorio e l'utente perderebbe il focus, "perdendo" le cifre
  // successive. Per i campi data rimandiamo quindi l'eventuale ridisegno al
  // vero termine della digitazione, cioè a quando il campo perde il focus
  // (vedi onFormFieldBlur/'focusout' in bindGlobalEvents), invece che ad ogni
  // singolo 'change'.
  if(t.type === 'date') return;

  if(e.type === 'change' && (field === 'isInfinite' || field === 'wantToBuy' || field === 'status')){
    if(field === 'isInfinite' && val === true){ draft.status = 'in-corso'; }
    renderFormBody();
  }
}

function onFormFieldBlur(e){
  const t = e.target;
  // Solo ora, a digitazione conclusa, il valore della data è definitivo:
  // è il momento giusto (e l'unico sicuro) per ridisegnare il form e
  // aggiornare le sezioni che dipendono dalla data di uscita (es. blocco
  // prenotazione/"in uscita").
  if(t.type === 'date' && t.matches('[data-field="releaseDate"]')){
    renderFormBody();
  }
}

function onFormDialogClick(e){
  const t = e.target;
  if(t.matches('[data-action="close"]')){ closeForm(); return; }
  if(t.matches('[data-action="save"]')){ saveDraft(); return; }
  if(t.matches('[data-action="add-owned"]')){
    draft.ownership.push({ platform:'', format:'digitale', store:'', drmFree:false, price:null });
    renderFormBody();
    return;
  }
  if(t.matches('[data-remove-own]')){
    const idx = Number(t.dataset.removeOwn);
    draft.ownership.splice(idx,1);
    renderFormBody();
    return;
  }
}

function closeForm(){
  document.getElementById('overlay-form').classList.add('hidden');
  draft = null;
}

async function saveDraft(){
  if(!draft.title || !draft.title.trim()){
    alert('Il titolo è obbligatorio.');
    return;
  }
  if(!isFutureRelease(draft)){
    // Se alla fine il gioco non risulta "in uscita" (data passata, vuota o mai
    // impostata), i campi di prenotazione non hanno più senso: li azzeriamo
    // per non lasciare dati incoerenti nascosti nella scheda.
    draft.preorder = false;
    draft.preorderPrice = null;
    draft.releasePlatforms = [];
  }
  if(draft.status !== 'finito'){
    draft.abandoned = false;
  }
  const idx = state.games.findIndex(x=>x.id===draft.id);
  const clean = JSON.parse(JSON.stringify(draft));
  delete clean._isNew;
  if(idx>=0) state.games[idx] = clean;
  else state.games.push(clean);
  await persistGame(clean);
  closeForm();
  render();
}

/* ============ Global bindings ============ */
function bindGlobalEvents(){
  document.getElementById('btn-add').addEventListener('click', ()=> openForm(null));

  // Form dialog: bound once on the persistent container, since its inner
  // HTML gets rebuilt on every renderFormBody() call (add/remove ownership rows, etc.)
  const formDlg = document.getElementById('form-dialog');
  formDlg.addEventListener('input', onFormFieldChange);
  formDlg.addEventListener('change', onFormFieldChange);
  // 'focusout' (a differenza di 'blur') risale nel DOM, quindi funziona con
  // la delega eventi qui usata su tutto il dialog: serve per il ridisegno
  // posticipato dei campi data, vedi onFormFieldBlur.
  formDlg.addEventListener('focusout', onFormFieldBlur);
  formDlg.addEventListener('click', onFormDialogClick);

  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    state.activeTab = btn.dataset.tab;
    state.visibleCount = PAGE_SIZE;
    render();
  });

  // Ricerca: filtra dal vivo la scheda attualmente attiva.
  document.getElementById('filter-search').addEventListener('input', e=>{
    getTabFilters(state.activeTab).search = e.target.value;
    renderChipsAndBadge();
    refreshTabsAndGrid();
  });
  // Ordinamento: non cambia il conteggio delle tab, quindi basta la griglia.
  document.getElementById('filter-sort').addEventListener('change', e=>{
    getTabFilters(state.activeTab).sort = e.target.value;
    state.visibleCount = PAGE_SIZE;
    renderGrid();
  });
  // Apre/chiude il pannello "a tendina" dei filtri della scheda attiva.
  document.getElementById('filtBtn').addEventListener('click', ()=>{
    document.getElementById('filter-panel').classList.toggle('open');
    document.getElementById('filtBtn').classList.toggle('open');
  });
  // Pannello filtri: click su un'opzione (chip singola/multipla o segmento).
  document.getElementById('filter-panel').addEventListener('click', e=>{
    const opt = e.target.closest('.opt');
    if(!opt) return;
    const groupEl = opt.closest('.group');
    const key = groupEl.dataset.key;
    const tf = getTabFilters(state.activeTab);
    if(groupEl.dataset.kind === 'chips'){
      opt.classList.toggle('on');
      const val = opt.dataset.value;
      const arr = tf[key] || (tf[key] = []);
      const idx = arr.indexOf(val);
      if(idx >= 0) arr.splice(idx,1); else arr.push(val);
    } else if(groupEl.dataset.kind === 'seg'){
      groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
      opt.classList.add('on');
      tf[key] = opt.dataset.value;
    }
    renderChipsAndBadge();
    refreshTabsAndGrid();
  });
  // Pannello filtri: cambio di un menu a tendina (es. "Entro", "Fascia di prezzo").
  document.getElementById('filter-panel').addEventListener('change', e=>{
    if(!e.target.matches('select.groupsel')) return;
    const groupEl = e.target.closest('.group');
    getTabFilters(state.activeTab)[groupEl.dataset.key] = e.target.value;
    renderChipsAndBadge();
    refreshTabsAndGrid();
  });
  // Pannello filtri: campo numerico libero (es. "Anno completamento") — non
  // tocchiamo il pannello per non far perdere il focus mentre si digita.
  document.getElementById('filter-panel').addEventListener('input', e=>{
    if(!e.target.matches('input.yearinput')) return;
    const groupEl = e.target.closest('.group');
    getTabFilters(state.activeTab)[groupEl.dataset.key] = e.target.value;
    renderChipsAndBadge();
    refreshTabsAndGrid();
  });

  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
  document.getElementById('confirm-ok').addEventListener('click', async ()=>{
    if(confirmDeleteId){
      const idToDelete = confirmDeleteId;
      state.games = state.games.filter(g=>g.id!==idToDelete);
      await deleteGamePersisted(idToDelete);
      closeConfirm();
      render();
    }
  });

  // click outside dialog closes overlay
  document.getElementById('overlay-detail').addEventListener('click', e=>{ if(e.target.id==='overlay-detail') closeDetail(); });
  // Il form di inserimento/modifica NON si chiude cliccando fuori: si esce
  // solo con il pulsante "Annulla", per evitare di perdere per sbaglio
  // i dati inseriti con un tap accidentale sullo sfondo.
  document.getElementById('overlay-confirm').addEventListener('click', e=>{ if(e.target.id==='overlay-confirm') closeConfirm(); });

  document.getElementById('btn-logout').addEventListener('click', ()=> signOut(auth));
}

/* ============ Login ============ */
function bindLoginEvents(){
  const btn = document.getElementById('login-submit');
  const emailInput = document.getElementById('login-email');
  const passInput = document.getElementById('login-password');
  const errorEl = document.getElementById('login-error');

  async function doLogin(){
    const email = emailInput.value.trim();
    const password = passInput.value;
    errorEl.style.display = 'none';
    if(!email || !password){
      errorEl.textContent = 'Inserisci email e password.';
      errorEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Accesso in corso…';
    try{
      await Promise.race([
        signInWithEmailAndPassword(auth, email, password),
        new Promise((_, reject) => setTimeout(()=> reject({ code:'timeout' }), 12000))
      ]);
      passInput.value = '';
    }catch(e){
      console.error('Errore di login', e);
      const code = e && e.code;
      if(code === 'timeout'){
        errorEl.textContent = "Il login sta impiegando troppo tempo (nessuna risposta entro 12s): probabile problema di rete o di come è stato aperto il file. Codice: timeout.";
      } else if(code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found'){
        errorEl.textContent = 'Email o password non corrette.';
      } else if(code === 'auth/network-request-failed'){
        errorEl.textContent = 'Errore di rete: verifica la connessione internet del telefono. Codice: auth/network-request-failed.';
      } else {
        errorEl.textContent = 'Errore di accesso' + (code ? ' — codice: ' + code : '') + '. Riprova o segnalamelo con questo codice.';
      }
      errorEl.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  btn.addEventListener('click', doLogin);
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  emailInput.addEventListener('keydown', e=>{ if(e.key==='Enter') passInput.focus(); });
}

bindGlobalEvents();
bindLoginEvents();

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadGames();
  } else {
    currentUser = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }
});

})();
</script>
